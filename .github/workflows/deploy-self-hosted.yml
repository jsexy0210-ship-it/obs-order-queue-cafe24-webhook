name: Deploy to office runner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mangotcg-production
  cancel-in-progress: false

jobs:
  deploy:
    # 등록 방식에 따른 OS 라벨 차이로 작업이 멈추지 않도록 사무실 self-hosted runner를 사용합니다.
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      # clean:false는 runner 작업 폴더에 있는 .env.local 및 SQLite data/를 보존합니다.
      - name: Checkout production source without clearing runtime data
        uses: actions/checkout@v5
        with:
          clean: false

      # GitHub Secrets는 자동으로 서버 환경변수가 되지 않습니다. 배포 때만 .env.local로
      # 전달하며, 파일 내용이나 비밀값은 로그에 출력하지 않습니다.
      - name: Prepare protected runtime environment
        shell: pwsh
        env:
          ADMIN_PRIMARY_ID: ${{ secrets.ADMIN_PRIMARY_ID }}
          ADMIN_PRIMARY_PASSWORD: ${{ secrets.ADMIN_PRIMARY_PASSWORD }}
          ADMIN_SECONDARY_ID: ${{ secrets.ADMIN_SECONDARY_ID }}
          ADMIN_SECONDARY_PASSWORD: ${{ secrets.ADMIN_SECONDARY_PASSWORD }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_REDIRECT_URI: ${{ secrets.CAFE24_REDIRECT_URI }}
          CAFE24_REWARD_LIVE_ENABLED: ${{ secrets.CAFE24_REWARD_LIVE_ENABLED }}
          CAFE24_TOKEN_ENCRYPTION_KEY: ${{ secrets.CAFE24_TOKEN_ENCRYPTION_KEY }}
          CAFE24_WEBHOOK_TOKEN: ${{ secrets.CAFE24_WEBHOOK_TOKEN }}
        run: |
          $required = @(
            "ADMIN_PRIMARY_ID", "ADMIN_PRIMARY_PASSWORD",
            "ADMIN_SECONDARY_ID", "ADMIN_SECONDARY_PASSWORD",
            "CAFE24_CLIENT_ID", "CAFE24_CLIENT_SECRET", "CAFE24_MALL_ID",
            "CAFE24_REDIRECT_URI", "CAFE24_REWARD_LIVE_ENABLED",
            "CAFE24_TOKEN_ENCRYPTION_KEY", "CAFE24_WEBHOOK_TOKEN"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "필수 GitHub Actions Secret이 없습니다: $($missing -join ', ')"
          }

          $environmentLines = @(
            "ADMIN_PRIMARY_ID=$env:ADMIN_PRIMARY_ID",
            "ADMIN_PRIMARY_PASSWORD=$env:ADMIN_PRIMARY_PASSWORD",
            "ADMIN_SECONDARY_ID=$env:ADMIN_SECONDARY_ID",
            "ADMIN_SECONDARY_PASSWORD=$env:ADMIN_SECONDARY_PASSWORD",
            "CAFE24_MALL_ID=$env:CAFE24_MALL_ID",
            "CAFE24_CLIENT_ID=$env:CAFE24_CLIENT_ID",
            "CAFE24_CLIENT_SECRET=$env:CAFE24_CLIENT_SECRET",
            "CAFE24_REDIRECT_URI=$env:CAFE24_REDIRECT_URI",
            "CAFE24_OAUTH_SCOPES=mall.read_application,mall.write_application,mall.read_category,mall.read_product,mall.write_product,mall.read_collection,mall.read_supply,mall.read_order,mall.read_customer,mall.write_customer,mall.read_promotion,mall.read_mileage,mall.write_mileage",
            "CAFE24_REWARD_LIVE_ENABLED=$env:CAFE24_REWARD_LIVE_ENABLED",
            "CAFE24_TOKEN_ENCRYPTION_KEY=$env:CAFE24_TOKEN_ENCRYPTION_KEY",
            "CAFE24_WEBHOOK_TOKEN=$env:CAFE24_WEBHOOK_TOKEN"
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE ".env.local"),
            $environmentLines,
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "운영 환경변수 파일을 준비했습니다."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # better-sqlite3 Windows 사전 빌드를 검증한 Node.js 22 LTS 패치 버전입니다.
          node-version: 22.18.0
          cache: npm

      - name: Install and build
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm 의존성 설치에 실패했습니다."
          }
          npm run build
          if ($LASTEXITCODE -ne 0) {
            throw "Next.js 프로덕션 빌드에 실패했습니다."
          }
          npm install --global pm2@5.4.3
          if ($LASTEXITCODE -ne 0) {
            throw "PM2 설치에 실패했습니다."
          }

      - name: Restart MangoTCG production process
        shell: pwsh
        run: |
          $npmGlobalBin = (& npm prefix -g).Trim()
          $pm2Command = Join-Path $npmGlobalBin "pm2.cmd"
          if (-not (Test-Path $pm2Command)) {
            throw "PM2가 설치되어 있지 않습니다. 기존 운영 프로세스를 건드리지 않았습니다."
          }

          $pm2Config = Join-Path $env:GITHUB_WORKSPACE "ecosystem.config.cjs"
          if (-not (Test-Path $pm2Config)) {
            throw "PM2 운영 설정 파일을 찾지 못했습니다."
          }

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\.env.local")) {
            Write-Warning ".env.local을 찾지 못했습니다. runner의 시스템 환경변수로 운영 중인지 확인하세요."
          }

          & $pm2Command startOrReload $pm2Config --update-env
          if ($LASTEXITCODE -ne 0) {
            throw "MangoTCG PM2 프로세스를 시작 또는 재시작하지 못했습니다."
          }
          & $pm2Command save

      - name: Verify local production endpoint
        shell: pwsh
        run: |
          $healthy = $false
          foreach ($attempt in 1..6) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:3000/admin/login" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $healthy) {
            throw "로컬 운영 엔드포인트(http://127.0.0.1:3000/admin/login) 헬스체크에 실패했습니다."
          }
