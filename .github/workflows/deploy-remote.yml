name: Deploy production remotely

on:
  workflow_dispatch:
    inputs:
      recovery_diagnose:
        description: 'Run read-only runtime recovery diagnosis'
        required: false
        type: boolean
        default: false
      recovery_restore:
        description: 'Restore runtime DB from deleted open files and rebuild production'
        required: false
        type: boolean
        default: false
      youtube_nickname_backfill:
        description: 'Backfill one missing order nickname from Cafe24 into the production DB'
        required: false
        type: boolean
        default: false
      nickname_backfill_cutoff_kst:
        description: 'Only inspect orders from this KST minute onward, YYYY-MM-DD HH:MM'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mangotcg-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.MANGO_REMOTE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy to the existing production Windows host
        env:
          MANGO_RECOVERY_DIAGNOSE: ${{ inputs.recovery_diagnose && 'true' || 'false' }}
          MANGO_RECOVERY_RESTORE: ${{ inputs.recovery_restore && 'true' || 'false' }}
          MANGO_YOUTUBE_NICKNAME_BACKFILL: ${{ inputs.youtube_nickname_backfill && 'true' || 'false' }}
          MANGO_BACKFILL_CUTOFF_KST: ${{ inputs.nickname_backfill_cutoff_kst }}
          MANGO_RECOVERY_ADMIN_PRIMARY_ID: ${{ secrets.ADMIN_PRIMARY_ID }}
          MANGO_RECOVERY_ADMIN_PRIMARY_PASSWORD: ${{ secrets.ADMIN_PRIMARY_PASSWORD }}
          MANGO_RECOVERY_ADMIN_SECONDARY_ID: ${{ secrets.ADMIN_SECONDARY_ID }}
          MANGO_RECOVERY_ADMIN_SECONDARY_PASSWORD: ${{ secrets.ADMIN_SECONDARY_PASSWORD }}
          MANGO_RECOVERY_CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          MANGO_RECOVERY_CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          MANGO_RECOVERY_CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          MANGO_RECOVERY_CAFE24_REDIRECT_URI: ${{ secrets.CAFE24_REDIRECT_URI }}
          MANGO_RECOVERY_CAFE24_TOKEN_ENCRYPTION_KEY: ${{ secrets.CAFE24_TOKEN_ENCRYPTION_KEY }}
          MANGO_RECOVERY_CAFE24_WEBHOOK_TOKEN: ${{ secrets.CAFE24_WEBHOOK_TOKEN }}
          MANGO_RECOVERY_CAFE24_OAUTH_SCOPES: ${{ secrets.CAFE24_OAUTH_SCOPES }}
          MANGO_RECOVERY_CAFE24_REWARD_LIVE_ENABLED: ${{ secrets.CAFE24_REWARD_LIVE_ENABLED }}
          MANGO_RECOVERY_CAFE24_NATIVE_REWARDS_DISABLED: ${{ secrets.CAFE24_NATIVE_REWARDS_DISABLED }}
          MANGO_RECOVERY_CAFE24_REWARD_START_AT: ${{ secrets.CAFE24_REWARD_START_AT }}
          MANGO_DEPLOY_HOST: ${{ secrets.MANGO_DEPLOY_HOST }}
          MANGO_DEPLOY_PORT: ${{ secrets.MANGO_DEPLOY_PORT }}
          MANGO_DEPLOY_USER: ${{ secrets.MANGO_DEPLOY_USER }}
          MANGO_DEPLOY_SSH_KEY: ${{ secrets.MANGO_DEPLOY_SSH_KEY }}
          MANGO_DEPLOY_KNOWN_HOSTS: ${{ secrets.MANGO_DEPLOY_KNOWN_HOSTS }}
          MANGO_DEPLOY_APP_PATH: ${{ secrets.MANGO_DEPLOY_APP_PATH }}
        run: python scripts/remote-deploy.py
