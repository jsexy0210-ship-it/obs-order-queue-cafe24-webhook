name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject tracked runtime data
        shell: bash
        run: |
          if [ -n "$(git ls-files 'data/*')" ]; then
            echo "::error::Runtime data under data/ must never be committed."
            git ls-files 'data/*'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify reward activation deployment guard
        shell: pwsh
        run: ./scripts/test-deploy-reward-guard.ps1

      - name: Check remote deployment configuration and PowerShell syntax
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'test_remote_deploy.py'
          if ($LASTEXITCODE -ne 0) { throw "Remote deployment tests failed" }
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/deploy-windows.ps1"),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
